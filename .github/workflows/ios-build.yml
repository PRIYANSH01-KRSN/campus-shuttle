name: Build iOS IPA for SideStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Verify Node version
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          node --version
          npx cap sync ios

      - name: Build unsigned Xcode project
        run: |
          xcodebuild clean build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          cd build/DerivedData/Build/Products/Release-iphoneos
          mkdir Payload
          cp -R App.app Payload/
          zip -r ShuttleApp.ipa Payload
          mv ShuttleApp.ipa ../../../../../

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShuttleApp-iOS
          path: ShuttleApp.ipa
          retention-days: 7
